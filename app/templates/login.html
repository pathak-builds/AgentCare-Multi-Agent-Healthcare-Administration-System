{% extends "base.html" %}

{% block title %}Login - AgentCare{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">AgentCare Login</h3>
            </div>

            <div class="card-body">

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" action="/login">

                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                    <button
                        class="btn btn-primary w-100"
                        type="submit">
                        Login
                    </button>

                </form>

                <hr>

                <p class="text-center">
                    Don't have an account?
                    <a href="/register">Register</a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
