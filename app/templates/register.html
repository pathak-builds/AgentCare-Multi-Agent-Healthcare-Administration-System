{% extends "base.html" %}

{% block title %}Register - AgentCare{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-success text-white">
                <h3>Create Account</h3>
            </div>

            <div class="card-body">

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" action="/register">

                    <div class="mb-3">
                        <label>Full Name</label>
                        <input
                            class="form-control"
                            type="text"
                            name="full_name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input
                            class="form-control"
                            type="email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input
                            class="form-control"
                            type="password"
                            name="password"
                            required
                        >
                    </div>

                    <button
                        class="btn btn-success w-100"
                        type="submit">
                        Register
                    </button>

                </form>

                <hr>

                <p class="text-center">
                    Already have an account?
                    <a href="/login">Login</a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
