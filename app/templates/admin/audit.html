{% extends "base.html" %}
{% block title %}Audit Logs{% endblock %}
{% block content %}
<h2>Audit Logs</h2>
<table class="table">
    <thead><tr><th>Time</th><th>Event</th><th>Description</th></tr></thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.created_at }}</td>
            <td>{{ log.event_type }}</td>
            <td>{{ log.description }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
